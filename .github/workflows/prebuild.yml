# Reusable workflow: N-API prebuild for darwin-arm64 (the only platform/arch native functionality
# works on — see binding.gyp and scripts/install.mjs; package.json itself has no "os"/"cpu"
# restriction so `npm install` still succeeds everywhere else).
# Call from CI (PR/push) to verify the prebuild path compiles; call from release with artifacts
# for npm pack.

name: Prebuild native addon

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Upload the .node as a workflow artifact (off for PR smoke builds)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prebuild:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
      - run: npm install --no-package-lock --ignore-scripts
        name: Install dependencies
      - name: Create N-API prebuild
        run: npm run build:prebuilds
      - name: Upload prebuild
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: prebuild-darwin-arm64
          path: prebuilds/
